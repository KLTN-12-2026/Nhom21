<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý thông tin cá nhân</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/mobile.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    body,
    input,
    select,
    button {
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #1f2937;
    }

    .page {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .page-header {
      margin-bottom: 8px;
    }

    .card {
      width: 100%;
      max-width: 100% !important;
      margin: 0 0 16px 0;
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 14px;
      padding: 18px 24px;
    }

    .section-title {
      margin: 0 0 16px;
      color: #0277bd;
      font-size: 20px;
      font-weight: 700;
    }

    #hoSoForm,
    #changePasswordForm {
      margin: 0 !important;
      padding: 0 !important;
    }

    /* =========================
       FORM THÔNG TIN CÁ NHÂN
       ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 16px;
      row-gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 0 !important;
    }

    .form-group label {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #0f4c81;
    }

    .required-mark {
      color: #e53935;
      margin-left: 2px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      height: 42px !important;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #0288d1;
      box-shadow: 0 0 0 2px rgba(2, 136, 209, 0.10);
    }

    .form-group input.input-error,
    .form-group select.input-error {
      border-color: #e53935 !important;
      box-shadow: 0 0 0 2px rgba(229, 57, 53, 0.12) !important;
    }

    .form-group input.input-success,
    .form-group select.input-success {
      border-color: #16a34a !important;
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.10) !important;
    }

    .error-message {
      min-height: 14px;
      margin: 0;
      color: #e53935;
      font-size: 12px;
      line-height: 14px;
    }

    /* =========================
       NÚT
       ========================= */

    .actions {
      margin-top: 4px !important;
      display: flex;
      justify-content: flex-end !important;
      align-items: center;
    }

    .btn-save {
      width: auto !important;
      min-width: 140px;
      height: 35px;
      padding: 8px 18px;
      border: none;
      border-radius: 9px !important;
      background: #0288d1;
      color: #fff;
      font-size: 13px !important;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .btn-save:hover {
      background: #0277bd;
    }

    .btn-save:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* =========================
       ĐỔI MẬT KHẨU
       ========================= */

    .password-description {
      margin: -6px 0 14px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    #changePasswordForm {
      width: 100%;
    }

    .password-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 16px;
      row-gap: 8px;
      width: 100%;
    }

    .password-input-wrap {
      position: relative;
      width: 100%;
    }

    .password-input-wrap input {
      width: 100%;
      padding-right: 44px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #64748b;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password:hover {
      background: #f1f5f9;
      color: #0288d1;
    }

    .password-note {
      margin-top: 2px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    #changePasswordForm .actions {
      margin-top: 8px !important;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 1100px) {
      .password-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {

      .form-grid,
      .password-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }

      .btn-save {
        width: 100% !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="page-header"></div>

    <!-- =========================
         THÔNG TIN CÁ NHÂN
         ========================= -->

    <div class="card">
      <h2 class="section-title">Thông tin cá nhân</h2>

      <form id="hoSoForm" novalidate>
        <div class="form-grid">

          <div class="form-group">
            <label for="hoTenInput">
              Họ tên <span class="required-mark">*</span>
            </label>

            <input type="text" id="hoTenInput" placeholder="Nhập họ tên" maxlength="50" autocomplete="name" />

            <div class="error-message" data-for="hoTenInput"></div>
          </div>

          <div class="form-group">
            <label for="ngaySinhInput">
              Ngày sinh <span class="required-mark">*</span>
            </label>

            <input type="date" id="ngaySinhInput" max="" />

            <div class="error-message" data-for="ngaySinhInput"></div>
          </div>

          <div class="form-group">
            <label for="gioiTinhInput">
              Giới tính <span class="required-mark">*</span>
            </label>

            <select id="gioiTinhInput">
              <option value="">-- Chọn --</option>
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
              <option value="Khác">Khác</option>
            </select>

            <div class="error-message" data-for="gioiTinhInput"></div>
          </div>

          <div class="form-group">
            <label for="sdtInput">
              Số điện thoại <span class="required-mark">*</span>
            </label>

            <input type="text" id="sdtInput" placeholder="Nhập số điện thoại" inputmode="numeric" maxlength="10"
              autocomplete="tel" />

            <div class="error-message" data-for="sdtInput"></div>
          </div>

          <div class="form-group">
            <label for="emailInput">
              Email <span class="required-mark">*</span>
            </label>

            <input type="text" id="emailInput" placeholder="Nhập email" maxlength="100" autocomplete="email" />

            <div class="error-message" data-for="emailInput"></div>
          </div>

          <div class="form-group">
            <label for="diaChiInput">
              Địa chỉ <span class="required-mark">*</span>
            </label>

            <input type="text" id="diaChiInput" placeholder="Nhập địa chỉ" maxlength="100"
              autocomplete="street-address" />

            <div class="error-message" data-for="diaChiInput"></div>
          </div>

        </div>

        <div class="actions">
          <button class="btn-save" id="btnSaveProfile" type="submit">
            Lưu thông tin cá nhân
          </button>
        </div>
      </form>
    </div>

    <!-- =========================
         ĐỔI MẬT KHẨU
         ========================= -->

    <div class="card">
      <h2 class="section-title">Đổi mật khẩu</h2>

      <p class="password-description">
        Để bảo vệ tài khoản, vui lòng nhập mật khẩu hiện tại trước khi đặt mật khẩu mới.
      </p>

      <form id="changePasswordForm" novalidate>
        <div class="password-grid">

          <div class="form-group">
            <label for="currentPasswordInput">
              Mật khẩu hiện tại
              <span class="required-mark">*</span>
            </label>

            <div class="password-input-wrap">
              <input type="password" id="currentPasswordInput" placeholder="Nhập mật khẩu hiện tại" maxlength="32"
                autocomplete="current-password" />

              <button type="button" class="toggle-password" data-target="currentPasswordInput"
                aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                👁
              </button>
            </div>

            <div class="error-message" data-for="currentPasswordInput"></div>
          </div>

          <div class="form-group">
            <label for="newPasswordInput">
              Mật khẩu mới
              <span class="required-mark">*</span>
            </label>

            <div class="password-input-wrap">
              <input type="password" id="newPasswordInput" placeholder="Nhập mật khẩu mới" maxlength="32"
                autocomplete="new-password" />

              <button type="button" class="toggle-password" data-target="newPasswordInput" aria-label="Hiện mật khẩu"
                title="Hiện mật khẩu">
                👁
              </button>
            </div>

            <div class="error-message" data-for="newPasswordInput"></div>
          </div>

          <div class="form-group">
            <label for="confirmPasswordInput">
              Xác nhận mật khẩu mới
              <span class="required-mark">*</span>
            </label>

            <div class="password-input-wrap">
              <input type="password" id="confirmPasswordInput" placeholder="Nhập lại mật khẩu mới" maxlength="32"
                autocomplete="new-password" />

              <button type="button" class="toggle-password" data-target="confirmPasswordInput"
                aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                👁
              </button>
            </div>

            <div class="error-message" data-for="confirmPasswordInput"></div>
          </div>

        </div>

        <div class="password-note">
          Mật khẩu mới phải từ 8–32 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt (!@#$%^&amp;*).
        </div>

        <div class="actions">
          <button class="btn-save" id="btnChangePassword" type="submit">
            Đổi mật khẩu
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/common/jwt-handler.js"></script>
  <script src="../../js/khach-hang/thongtin-canhan.js"></script>
</body>

</html>
