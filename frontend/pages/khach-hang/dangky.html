<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản - Hệ thống tiêm chủng</title>

  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #03a9f4, #0288d1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .register-card {
      width: 360px;
      max-width: 95%;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      padding: 22px 20px;
    }

    .register-title {
      font-size: 24px;
      font-weight: 700;
      color: #0277bd;
      text-align: center;
      margin-bottom: 6px;
    }

    .register-subtitle {
      font-size: 13px;
      color: #607d8b;
      text-align: center;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #01579b;
      font-size: 13px;
    }

    .form-group input {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid #b0bec5;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }

    .form-group input:focus {
      border-color: #0288d1;
      box-shadow: 0 0 0 2px rgba(2, 136, 209, 0.12);
    }

    /* =========================
       SỐ ĐIỆN THOẠI + GỬI OTP
       ========================= */

    .otp-row {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .otp-row input {
      flex: 1;
      min-width: 0;
      width: auto;
    }

    .btn-otp {
      height: 40px;
      padding: 0 12px;
      border: none;
      border-radius: 8px;
      background: #e1f5fe;
      color: #0277bd;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: 0.2s;
    }

    .btn-otp:hover {
      background: #b3e5fc;
    }

    /* =========================
       THÔNG BÁO LỖI
       ========================= */

    .error-message {
      display: block;
      width: 100%;
      color: #e53935;
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.4;
      min-height: 0;
    }

    .input-error {
      border-color: #e53935 !important;
    }

    .input-success {
      border-color: #43a047 !important;
    }

    .btn-primary {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #0288d1, #03a9f4);
      cursor: pointer;
      margin-top: 6px;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 14px rgba(2, 136, 209, 0.25);
      transform: translateY(-1px);
    }

    .register-footer {
      font-size: 12px;
      margin-top: 12px;
      color: #607d8b;
      text-align: center;
    }

    .register-footer a {
      color: #0288d1;
      font-weight: 600;
      text-decoration: none;
    }

    .register-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 420px) {
      .register-card {
        width: 100%;
        padding: 18px 16px;
      }

      .register-title {
        font-size: 22px;
      }

      .otp-row {
        flex-direction: column;
        align-items: stretch;
      }

      .otp-row input {
        width: 100%;
      }

      .btn-otp {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="register-card">

    <div class="register-title">
      Đăng ký tài khoản
    </div>

    <div class="register-subtitle">
      Đăng ký để sử dụng hệ thống tiêm chủng.
    </div>

    <form id="registerForm">

      <!-- HỌ TÊN -->
      <div class="form-group">
        <label for="fullName">Họ và tên *</label>

        <input type="text" id="fullName" placeholder="VD: Nguyễn Văn A" required>

        <div class="error-message" data-for="fullName">
        </div>
      </div>


      <!-- TÀI KHOẢN -->
      <div class="form-group">
        <label for="username">Tài khoản *</label>

        <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>

        <div class="error-message" data-for="username">
        </div>
      </div>


      <!-- MẬT KHẨU -->
      <div class="form-group">
        <label for="password">Mật khẩu *</label>

        <input type="password" id="password" placeholder="Nhập mật khẩu" required>

        <div class="error-message" data-for="password">
        </div>
      </div>


      <!-- NHẬP LẠI MẬT KHẨU -->
      <div class="form-group">
        <label for="repassword">Nhập lại mật khẩu *</label>

        <input type="password" id="repassword" placeholder="Nhập lại mật khẩu" required>

        <div class="error-message" data-for="repassword">
        </div>
      </div>


      <!-- SỐ ĐIỆN THOẠI -->
      <div class="form-group">
        <label for="phone">Số điện thoại *</label>

        <div class="otp-row">

          <input type="text" id="phone" placeholder="VD: 09xx xxx xxx" required>

          <button type="button" class="btn-otp" onclick="sendOtp()">
            Gửi OTP
          </button>

        </div>

        <!-- QUAN TRỌNG: lỗi nằm NGOÀI otp-row -->
        <div class="error-message" data-for="phone">
        </div>
      </div>


      <!-- OTP -->
      <div class="form-group">
        <label for="otp">Mã OTP *</label>

        <input type="text" id="otp" placeholder="Nhập mã OTP" required>

        <div class="error-message" data-for="otp">
        </div>
      </div>


      <input type="hidden" id="role" value="KHACH_HANG">


      <button type="submit" class="btn-primary">
        Đăng ký
      </button>

    </form>


    <div class="register-footer">
      Đã có tài khoản?

      <a href="dangnhap.html">
        Đăng nhập ngay
      </a>
    </div>

  </div>


  <script src="../js/dangky.js"></script>

</body>

</html>
