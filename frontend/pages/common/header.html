<style>
    .topbar {
        background: #0288d1;
        color: #fff;
        padding: 10px 0;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
        position: sticky;
        top: 0;
        z-index: 1000;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    .topbar * {
        box-sizing: border-box;
    }

    .topbar-inner {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
    }

    .topbar .logo {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.2px;
        white-space: nowrap;
        flex-shrink: 0;
        color: #fff;
        text-decoration: none;
    }

    .topbar .nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
        flex-wrap: nowrap;
        flex: 1;
    }

    .topbar .nav>a,
    .topbar .dropdown-toggle {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        padding: 6px 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        opacity: 0.95;
        white-space: nowrap;
    }

    .topbar .nav>a:hover,
    .topbar .dropdown-toggle:hover {
        opacity: 1;
        text-decoration: underline;
        text-underline-offset: 5px;
    }

    .topbar .dropdown {
        position: relative;
        flex-shrink: 0;
    }

    .topbar .dropdown-toggle i {
        font-size: 11px;
        transition: transform 0.2s ease;
    }

    .topbar .dropdown.active .dropdown-toggle i {
        transform: rotate(180deg);
    }

    .topbar .dropdown-menu {
        display: none;
        position: absolute;
        top: 34px;
        left: 0;
        min-width: 280px;
        background: #fff;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
        overflow: hidden;
        border: 1px solid #dbeafe;
        z-index: 2000;
    }

    .topbar .dropdown-menu.show {
        display: block;
    }

    .topbar .dropdown-menu a {
        display: block;
        color: #1e40af;
        padding: 14px 18px;
        font-size: 14px;
        font-weight: 500;
        border-bottom: 1px solid #e5edf8;
        text-decoration: none;
        background: #fff;
    }

    .topbar .dropdown-menu a:last-child {
        border-bottom: none;
    }

    .topbar .dropdown-menu a:hover {
        background: #f8fbff;
        color: #f59e0b;
    }

    .topbar .notification-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        flex-shrink: 0;
    }

    .topbar .notification-box {
        position: relative;
        display: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 34px;
        padding: 0;
        cursor: pointer;
        color: #fff;
        margin-left: 4px;
        background: transparent;
        border: none;
    }

    .topbar .notification-box:hover {
        opacity: 0.85;
    }

    .topbar .notification-box i {
        font-size: 16px;
    }

    .topbar .noti-text {
        font-size: 14px;
        white-space: nowrap;
    }

    .topbar .notification-badge {
        position: absolute;
        top: -2px;
        right: -10px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 999px;
        background: #ef4444;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        display: none;
        align-items: center;
        justify-content: center;
        line-height: 16px;
    }

    .topbar .notification-badge.show {
        display: inline-flex;
    }

    .topbar .notification-dropdown {
        position: absolute;
        top: 36px;
        right: 0;
        width: 320px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        border: 1px solid #dbeafe;
        overflow: hidden;
        display: none;
        z-index: 3000;
        color: #1e293b;
    }

    .topbar .notification-dropdown.show {
        display: block;
    }

    .topbar .notification-dropdown-header {
        padding: 12px 14px;
        font-size: 15px;
        font-weight: 700;
        color: #01579b;
        border-bottom: 1px solid #e5edf8;
        background: #f8fbff;
    }

    .topbar .notification-list {
        max-height: 320px;
        overflow-y: auto;
    }

    .topbar .notification-empty {
        padding: 16px 14px;
        text-align: center;
        color: #94a3b8;
        font-size: 12px;
    }

    .topbar .notification-dropdown-footer {
        padding: 12px 14px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: #0288d1;
        cursor: pointer;
    }

    .topbar .notification-dropdown-footer:hover {
        background: #f8fbff;
    }


    .topbar .user-box {
        width: 34px;
        height: 34px;
        padding: 0;
        border: none;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: transparent;
        cursor: pointer;
        transition: transform 0.2s ease;
        flex-shrink: 0;
    }

    .topbar .user-box:hover {
        transform: scale(1.05);
    }

    .topbar .user-box:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: scale(1.03);
    }

    .topbar .user-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    @media (max-width: 1000px) {
        .topbar-inner {
            flex-direction: column;
            align-items: stretch;
        }

        .topbar .nav {
            width: 100%;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
    }

    @media (max-width: 600px) {
        .topbar .noti-text {
            font-size: 12px;
        }

        .topbar .notification-dropdown {
            right: -40px;
            width: 280px;
        }

        .topbar .user-box {
            width: 34px;
            height: 34px;
        }
    }
</style>

<header class="topbar">

        <a class="logo" href="/frontend/pages/common/trangchu.html">

        </a>

        <nav class="nav" aria-label="Điều hướng chính">

            <a href="trangchu.html">Gói vaccine</a>

                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                <div class="dropdown-menu" id="camNangMenu">

                    <a href="huong-dan-tiem.html#truoc-tiem">

                    </a>

                    <a href="huong-dan-tiem.html#sau-tiem">

                </div>

            <a href="banggia.html">Bảng giá</a>

            <a href="trangchu.html">Quy trình</a>

            <div class="notification-wrapper">

                <button class="notification-box" id="notificationBox" type="button" title="Thông báo"
                    aria-label="Thông báo">
                    <span class="noti-text">Thông báo</span>

                    <i class="fa-solid fa-bell"></i>

                    </div>

            </div>

            <button class="user-box" id="userBox" type="button" title="Tài khoản" aria-label="Tài khoản">
                <img src="../../img/Logo-user.jpg" alt="Tài khoản" class="user-img"
                    onerror="this.onerror=null; this.src='../img/Logo-us.png';">
            </button>

        </nav>
    </div>
</header>
