<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - VAX AI</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/mobile.css">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <a href="trangchu.html" class="header-home-link">
                HỆ THỐNG QUẢN LÝ TIÊM CHỦNG VAX AI
            </a>
        </div>
    </header>


    <div class="layout">

        <aside class="sidebar">

            <div class="user-box">
                <div class="user-box-title" id="userBoxTitle">
                    Tài khoản:
                </div>

                <strong id="usernameDisplay"></strong>
            </div>
            <div>
                <!-- Tiêu đề menu sẽ thay đổi theo role -->
                <div class="menu-title" id="menuTitle">
                    Menu
                </div>
                <ul class="menu-list" id="menuList"></ul>
            </div>

            <div id="logout">
                Đăng xuất
            </div>

        </aside>
        <main class="content">

            <div class="content-card">
                <div class="content-header">

                    <h2 id="contentTitle">
                        Xin chào
                    </h2>

                    <p id="contentSubtitle">
                        Chọn chức năng ở bên trái để sử dụng.
                    </p>
                </div>
                <div id="welcomeBox" class="welcome-box">
                    <div class="welcome-panels" id="welcomePanels">
                    </div>

                </div>

                <div id="welcomeBox" class="welcome-box">

                    <div class="welcome-panels" id="welcomePanels">
                    </div>

                </div>
                <iframe id="pageFrame" src="" title="Nội dung chức năng">
                </iframe>

            </div>

        </main>

    </div>


    <script src="../../js/common/jwt-handler.js"></script>
    <script src="../../js/common/dashboard.js"></script>

</body>

</html>
